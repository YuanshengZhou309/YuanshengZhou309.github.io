# Academic Pages / Minimal Mistakes configuration.
locale: "en-US"
site_theme: "default"
title: "Yuansheng Zhou"
title_separator: "|"
name: "Yuansheng Zhou"
description: "Yuansheng Zhou — MSc in Autonomous Systems. Machine learning, signal processing, intelligent sensing, robotics and automation."
url: "https://yuanshengzhou309.github.io"
baseurl: ""
repository: "YuanshengZhou309/YuanshengZhou309.github.io"

author:
  avatar: "yuansheng-zhou.jpg"
  name: "Yuansheng Zhou"
  bio: "MSc in Autonomous Systems, DTU · BEng in Mechanical Design, Manufacturing and Automation"
  location: "Kongens Lyngby, Denmark"
  email: "s232925@dtu.dk"
  github: "YuanshengZhou309"
  linkedin: "yuansheng-zhou-8142542a0"

publication_category:
  manuscripts:
    title: "Journal Articles"

breadcrumbs: false
words_per_minute: 160
future: false
read_more: "disabled"
talkmap_link: false
comments:
  provider: false
analytics:
  provider: false
atom_feed:
  hide: true

social:
  type: "Person"
  name: "Yuansheng Zhou"
  links:
    - "https://github.com/YuanshengZhou309"
    - "https://www.linkedin.com/in/yuansheng-zhou-8142542a0/"

include:
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .agents
  - .codex
  - .asset-cache
  - .bundle
  - .devcontainer
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - docker-compose.yaml
  - Gemfile
  - Gemfile.lock
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - markdown_generator
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README.md
  - scripts
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - talkmap_out.ipynb
  - tmp
  - vendor
  - WEBSITE_CHANGES.md
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

collections:
  publications:
    output: true
    permalink: /publications/:path/
  portfolio:
    output: true
    permalink: /research/:path/

defaults:
  - scope:
      path: ""
    values:
      author_profile: true
      read_time: false
      show_date: false
      comments: false
      share: false
      related: false
  - scope:
      path: "_pages"
    values:
      layout: single
  - scope:
      path: ""
      type: publications
    values:
      layout: single
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single

sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
timezone: Europe/Copenhagen
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
compress_html:
  clippings: all
  ignore:
    envs: development
